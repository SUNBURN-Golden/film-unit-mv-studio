format:
  aspect_ratio: '4:3'
  resolution: 1440x1080
  fps: 24
visual_style:
  medium: 2D character animation
  background: warm gray paper
  line: thin black ink
  shading: minimal
  camera: mostly locked; characters and scene elements animate within the frame
palette:
  paper: '#ECEAE4'
  ink: '#181818'
  teal: '#48A6A0'
rules:
- no photorealism
- no cinematic dramatic lighting
- no unnecessary camera movement
- no text unless explicitly specified
- emotion should be understated
- movement should be economical but depict actual character or scene action
- no stop-motion aesthetic
- do not substitute camera-only pan or zoom for character or scene animation
draft: true
