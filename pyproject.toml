[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-unit-mv-studio"
version = "0.3.0"
description = "File-based, locked-shot music video compiler"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "soundfile>=0.12,<1", "librosa>=0.10,<2", "Pillow>=10,<13", "PyYAML>=6,<7", "matplotlib>=3.7,<4", "streamlit>=1.40,<2", "jsonschema>=4,<5", "fonttools>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
filmunit = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.data-files]
"share/film-unit/presets/concrete_glide" = ["presets/concrete_glide/style.yaml", "presets/concrete_glide/characters.yaml", "presets/concrete_glide/locations.yaml", "presets/concrete_glide/directing.yaml"]
"share/film-unit/presets/water_please" = ["presets/water_please/style.yaml", "presets/water_please/characters.yaml", "presets/water_please/locations.yaml", "presets/water_please/directing.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
