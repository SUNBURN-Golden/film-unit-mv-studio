name: Windows portable app

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'app/**'
      - 'scripts/*desktop*'
      - 'tests/test_desktop.py'
      - 'pyproject.toml'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python build dependencies
        run: python -m pip install -e '.[test,desktop]'
      - name: Prepare font, checked FFmpeg runtime and writable test paths
        shell: pwsh
        run: |
          python scripts/prepare_desktop_assets.py
          $homePath = Join-Path $env:RUNNER_TEMP "FILM UNIT 한글 테스트"
          "FILM_UNIT_HOME=$homePath" >> $env:GITHUB_ENV
          $env:FILM_UNIT_HOME = $homePath
          python -c "from desktop.runtime import configure_runtime; from desktop.ffmpeg_setup import ensure_ffmpeg; ensure_ffmpeg(configure_runtime())"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime setup failed' }
      - name: Windows filesystem and process-lock regressions
        run: python -m pytest tests/test_desktop.py -q
      - name: Build portable application
        run: python -m PyInstaller --noconfirm desktop/film_unit.spec
      - name: Record exact build inputs and third-party notices
        run: python scripts/package_desktop.py
      - name: Exercise the frozen executable, Korean subtitles and native launcher
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/FILM_UNIT/FILM_UNIT.exe).Path
          $evidence = Join-Path $env:RUNNER_TEMP "MV 한글 ' evidence"
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$evidence`"") -PassThru
          if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; throw 'Frozen smoke timeout' }
          if ($p.ExitCode -ne 0) { throw "Frozen smoke failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $evidence 'smoke.json'))) { throw 'No frozen smoke report' }
          $guiReport = Join-Path $evidence 'gui.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-gui', "`"$guiReport`"") -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw 'GUI smoke timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $guiReport)) { throw 'GUI smoke failed' }
          New-Item -ItemType Directory -Force desktop-evidence | Out-Null
          Copy-Item (Join-Path $evidence 'smoke.json'), $guiReport desktop-evidence/
          Copy-Item (Join-Path $evidence 'smoke_project/builds/B0001/MASTER_SUBBED.mp4') desktop-evidence/
          Copy-Item (Join-Path $evidence 'smoke_project/builds/B0001/subtitle_report.json') desktop-evidence/
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/FILM_UNIT -DestinationPath dist/FILM_UNIT-Windows-x64.zip
          Get-FileHash dist/FILM_UNIT-Windows-x64.zip -Algorithm SHA256 | Format-List | Out-File dist/FILM_UNIT-Windows-x64.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FILM_UNIT-Windows-x64
          path: |
            dist/FILM_UNIT-Windows-x64.zip
            dist/FILM_UNIT-Windows-x64.sha256.txt
            desktop-evidence/
          retention-days: 30
          compression-level: 0
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            ${{ env.FILM_UNIT_HOME }}/logs/
            build/FILM_UNIT/warn-*.txt
            build/film_unit/warn-*.txt
          if-no-files-found: ignore
